name = "tracker"
main = "src/index.js"
compatibility_date = "2026-06-22"

# All dashboards live in the KV namespace bound as MANUAL below — there is no
# external Google Sheet dependency.

# ── Manual entries (shared) ───────────────────────────────────────────────
# Backed by the "tracker_manual" KV namespace. The binding name MUST stay
# MANUAL (that's what the Worker code reads). To point at a different
# namespace, create one in the Cloudflare dashboard and swap the id below.
[[kv_namespaces]]
binding = "MANUAL"
id = "fe377c45c1fa42cb803f04235c726823"

# Optional: protect the Add/Delete actions with a shared password. Set this as a
# secret (Settings → Variables → Add → Encrypt), then the UI prompts for it once.
#   EDIT_TOKEN = "..."   (prefer a Secret over a plain var)

# Email sending (Muns raw API). Set the token as a SECRET — never commit it:
#   npx wrangler secret put MUNS_TOKEN
# Optional endpoint override (defaults to https://devde.muns.io/email/send/raw):
#   MUNS_EMAIL_URL = "https://devde.muns.io/email/send/raw"

# Munshot notetaker API token for tracking tasks (set as SECRET):
#   npx wrangler secret put MUNSBOT_TOKEN

# ── Publish to the Munshot admin page ─────────────────────────────────────
# The "Publish" button POSTs a dashboard to Munshot's create-dashboard endpoint:
#
#   POST https://birdnest.muns.io/agents/dashboards
#   Authorization: Bearer <MUNS_TOKEN>
#
# The endpoint is the built-in default; set MUNS_DASHBOARD_URL only if it moves:
#   npx wrangler secret put MUNS_DASHBOARD_URL
#
# Auth: publishing uses the SIGNED-IN USER'S session, not a service token.
# Creating a dashboard is a privileged action — MUNS_TOKEN sends digest emails
# and reads the people directory quite happily, but Munshot answers
#   403 {"message":"Insufficient authority"}
# when it tries to create one. (That is not a bad token: 401 means rejected,
# 403 means accepted but not permitted.)
#
# The tracker runs in an iframe on the Munshot site, so the host hands the
# browser the user's JWT over postMessage via the Munshot Dashboard SDK. The
# page forwards it on the publish request only, as an x-muns-user-token header,
# and the Worker uses it as the Bearer for that one outbound call — never
# stored, never logged, never sent anywhere else. Credential order:
#   1. the host user's JWT   2. MUNS_DASHBOARD_TOKEN   3. MUNS_TOKEN
#
#   MUNS_ALLOWED_ORIGINS  Comma-separated exact origins allowed to postMessage
#                         a session in. Defaults to https://chat.muns.io. This
#                         is the ENTIRE trust boundary — exact scheme+host, no
#                         wildcards, and it must never be empty (the SDK treats
#                         an empty list as "no list" and then accepts the first
#                         message from any origin). Add an entry if Munshot
#                         ever embeds the tracker from another subdomain.
#   MUNS_DEFAULT_CATEGORY Munshot REQUIRES a category on every dashboard and
#                         the tracker has no field for it, so publishing sends
#                         this. Defaults to "markets" (the value from Munshot's
#                         own API example). Override per deployment here, or
#                         per dashboard by putting a `category` on the entry.
#   MUNS_DASHBOARD_TOKEN  Optional service token for publishing outside the
#                         iframe, if one with dashboard-create rights is ever
#                         issued: npx wrangler secret put MUNS_DASHBOARD_TOKEN
#                         Keep it separate — overwriting MUNS_TOKEN would break
#                         the digest emails and the people directory.
#
# Because publishing now depends on the host session, the tracker must be
# opened FROM the Munshot site. Opened standalone it still runs, but publishing
# falls back to the service token and will 403 until one has the right.
#
# Field mapping lives in src/publish.js (buildPublishPayload). The tracker fills
# in title, link, description, type, sections, githubLink and category. The
# API's genuinely optional fields — tickers, sectors, industries, keywords,
# widgetConfig, organizationIds, userIds — are omitted unless a stored entry
# carries them, because inventing organizationIds/userIds would expose a
# dashboard to the wrong client. If Munshot rejects a publish, the toast names
# the offending field and the browser console prints what was sent.

# Nightly Build Update digest recipient. Defaults to tech@muns.io (your test
# inbox). Once verified, switch to the founder:
#   npx wrangler secret put DIGEST_TO     # then enter ceekay@muns.io
# (or set DIGEST_TO here as a plain [vars] entry if committing the address is OK)

# Scheduled triggers (UTC). IST = UTC + 5:30, so 9:00 PM IST = 15:30 UTC.
#   "30 15 * * *"  → daily 9pm IST   → daily status email (per-member/dashboard progress)
#   "30 15 * * 3"  → Wednesday 9pm IST → weekly Build-Update PDF digest (all PDFs, one email)
# Both go to DIGEST_TO (the founder). The handler branches on event.cron.
# The third cron runs the GitHub commit digest at 8:00pm IST (14:30 UTC) daily.
[triggers]
crons = ["30 15 * * *", "30 15 * * 3", "30 14 * * *"]

# ── Commit tracking — NO database needed (stored in the existing KV) ───────
# The Work-done view + each dashboard card show GitHub commits, and every day
# at 8pm IST a job pulls the last 24h of commits per repo and summarizes them
# into a few plain-English bullet points. It's OFF until you add these secrets:
#
#   1) Add the two account read-tokens + an LLM key (for the summaries).
#      Each dashboard repo belongs to ceekay or techmuns; the job matches the
#      repo owner to the right token (and falls back to the other if needed):
#        npx wrangler secret put CEEKAY_AT        # ceekay account read token
#        npx wrangler secret put TECHMUNS_AT      # techmuns account read token
#
#      The summaries run on Claude via Amazon Bedrock, with OpenAI as the
#      automatic fallback. Add whichever keys you have — Bedrock is used
#      whenever its key is present, and any Bedrock failure (missing key, 403,
#      throttling, timeout) silently falls through to OpenAI:
#        npx wrangler secret put BEDROCK_API_KEY  # primary — Claude on Bedrock
#        npx wrangler secret put OPENAI_API_KEY   # fallback
#
#      Confirm the Bedrock key in ten seconds, without triggering real work:
#        curl https://tracker.tech-441.workers.dev/api/health/llm
#      (add  -H "x-edit-token: <EDIT_TOKEN>"  if you've set an edit token).
#      It makes one cheap call and reports which provider and model answered.
#   2) Deploy:  npm run deploy
#   3) In the app, set each dashboard's GitHub repo (Edit → GitHub repo).
#
#   (Optional, exact auto-link) ceekay and techmuns are two SEPARATE Cloudflare
#   accounts, so add one Pages:Read token per account (either or both — the
#   Auto-link button merges Pages projects from whichever are set) so it can
#   read each dashboard's EXACT repo from its Pages project instead of
#   fuzzy-matching by name. Note: this only works for dashboards deployed as
#   Cloudflare Pages — Cloudflare's API has no way to read a Worker's
#   connected git repo yet, so Worker-hosted dashboards still rely on the
#   (pretty good) fuzzy name/URL matching, with a manual override in the
#   Auto-link review screen:
#        npx wrangler secret put CF_API_TOKEN_CEEKAY
#        npx wrangler secret put CF_ACCOUNT_ID_CEEKAY     # optional; else the token's first account
#        npx wrangler secret put CF_API_TOKEN_TECHMUNS
#        npx wrangler secret put CF_ACCOUNT_ID_TECHMUNS   # optional; else the token's first account
#
#   (Optional real-time) also add a push webhook on each repo (or org-wide):
#        Payload URL:  https://tracker.tech-441.workers.dev/api/gh-webhook
#        Content type: application/json   Event: "push"   Secret: <pick one>
#        npx wrangler secret put GITHUB_WEBHOOK_SECRET

# ── LLM settings (plain vars — the KEY itself is a secret, never here) ─────
# BEDROCK_API_KEY is the only secret involved. Set it in the dashboard
# (Workers → Settings → Variables and Secrets) or with `wrangler secret put`;
# the Worker reads it from the env binding. It never reaches the browser: every
# Bedrock call happens inside the Worker, and the client-side JS only ever
# talks to this Worker's own routes.
#
#   BEDROCK_REGION  AWS region for the Bedrock endpoint,
#                   https://bedrock-mantle.{region}.api.aws/anthropic/v1/messages
#                   Defaults to us-east-1 when unset.
#   LLM_PROVIDER    Force a provider. Unset = Bedrock when BEDROCK_API_KEY is
#                   present, else OpenAI. Set to "openai" to flip back to the
#                   old behaviour with no code change; "bedrock" pins Bedrock
#                   as primary even before the key is added.
#   BEDROCK_MODEL   Pin one model and skip the fallback chain. Unset, the
#                   Worker tries anthropic.claude-opus-5 →
#                   anthropic.claude-opus-4-8 → anthropic.claude-sonnet-5 and
#                   remembers the first that answers (Bedrock grants Opus 5
#                   per-account, so a 403 on it is expected, not a bug).
#
# No nodejs_compat needed: this uses only fetch / URL / JSON / AbortController,
# all of which are Workers built-ins. There is no AWS SDK and no SigV4 signing.
[vars]
BEDROCK_REGION = "us-east-1"
# MUNS_DEFAULT_CATEGORY = "markets"
# LLM_PROVIDER = "openai"
# BEDROCK_MODEL = "anthropic.claude-opus-4-8"
